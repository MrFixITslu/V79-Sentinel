# STAGING ONLY — do not import Acer production SQLite or expose publicly.
# This compose stack is intentionally independent of the running Hub/Tiquet.
name: v79-sentinel-internal-pilot

services:
  noc:
    container_name: v79-sentinel-stage-noc
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.noc
    ports:
      # Host access is localhost-only. Selection is done by select-private-port.py.
      - "127.0.0.1:${SENTINEL_HOST_PORT:?run select-private-port.py first}:8080"
    environment:
      SENTINEL_NOC_EXTERNAL_ORIGIN: "${SENTINEL_BROWSER_ORIGIN:?select a private browser origin}"
      SENTINEL_MONITORING_CONTEXT: docker
      SENTINEL_REVIEW_ENABLED: "0"
      SENTINEL_APPROVER_SERVICE_ENABLED: "0"
    command:
      - python
      - -m
      - noc.server
      - --bind
      - "127.0.0.1"
      - --port
      - "8788"
      - --db
      - /app/data/noc-staging.sqlite3
    volumes:
      - noc_stage_data:/app/data
    networks: [proxy_network]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 80
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8788/readyz',timeout=3); assert r.status==200"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: "no"

  monitor:
    container_name: v79-sentinel-stage-monitor
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    # The monitor and authenticated NOC must share LOOPBACK so the exact
    # existing mission bridge can call http://127.0.0.1:8787.
    network_mode: "service:noc"
    depends_on:
      noc:
        condition: service_started
    command:
      - python
      - sentinel.py
      - --live
      - --bind
      - "127.0.0.1"
      - --port
      - "8787"
    volumes:
      - monitor_stage_data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 80
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3); assert r.status==200"]
      interval: 40s
      timeout: 6s
      retries: 3
    restart: "no"

  ingress:
    container_name: v79-sentinel-stage-ingress
    image: nginx:alpine
    # Shares NOC's private namespace; only ingress binds 8080 on the
    # container's proxy_network address. Neither upstream binds eth0.
    network_mode: "service:noc"
    depends_on:
      noc:
        condition: service_healthy
      monitor:
        condition: service_healthy
    volumes:
      - ./nginx-private.conf:/etc/nginx/conf.d/default.conf:ro
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    mem_limit: 96m
    tmpfs:
      - /tmp:rw,size=8m,mode=1777
      - /var/cache/nginx:rw,size=8m,mode=1777
      - /var/run:rw,size=8m,mode=1777
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 6s
      retries: 3
    restart: "no"

networks:
  proxy_network:
    external: true

volumes:
  noc_stage_data:
  monitor_stage_data:
