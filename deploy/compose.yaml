services:
  sentinel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - sentinel_history:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3).read()"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sentinel_history:
