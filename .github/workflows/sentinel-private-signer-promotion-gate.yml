name: Sentinel private signer promotion NO-GO gate

on:
  pull_request:
    paths:
      - 'noc/owner_private_candidate.py'
      - 'noc/tests/test_owner_private_candidate.py'
      - '.github/workflows/sentinel-private-signer-promotion-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-private-signer-tests-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require dedicated signer security tests (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          test -f noc/owner_private_candidate.py
          if [ ! -f noc/tests/test_owner_private_candidate.py ]; then
            echo 'NO_GO_PRIVATE_SIGNER_DEDICATED_SECURITY_SUITE_MISSING'
            exit 1
          fi
          echo 'SOURCE_SECURITY_SUITE_PRESENT_NOT_YET_ACCEPTED'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run dedicated signer and durable replay tests without production inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cryptography==45.0.7'
          python -B -m unittest -v \
            noc.tests.test_owner_private_candidate \
            noc.tests.test_isolated_sqlite_durability
      - name: Enforce review-only evidence without source attestation
        run: |
          python -B - <<'PY'
          from pathlib import Path
          source = Path('noc/owner_private_candidate.py').read_text()
          for sentinel in ('"sourceProvenanceVerified": False',
                           '"trustedForExecutiveUse": False',
                           '"continuousMonitoringVerified": False',
                           '"alertsDispatched": False',
                           '"ticketCreationEnabled": False'):
              assert sentinel in source, 'REVIEW_ONLY_PROTECTION_MISSING'
          assert 'O_NOFOLLOW' in source
          print('SYNTHETIC_SIGNER_TESTS_ONLY_NO_PRODUCTION_CLEARANCE=PASS')
          PY
          echo 'INDEPENDENT_SOURCE_PROVENANCE_AND_GITGUARDIAN_HOLD_STILL_REQUIRED'
