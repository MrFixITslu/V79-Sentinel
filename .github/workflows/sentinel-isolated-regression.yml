name: Sentinel isolated regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  command-center:
    name: Isolated Python, Node and Chrome regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Install isolated Python crypto test dependency
        run: python3 -m pip install 'cryptography==45.0.7'
      - name: Python NOC tests with synthetic databases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s noc/tests -p 'test_*.py'
      - name: Python/JavaScript syntax
        run: |
          python3 -m compileall -q noc
          for file in noc/web/*.js; do node --check "$file"; done
      - name: NetPulse metadata validation
        run: node noc/tests/test_enterprise_netpulse.cjs
      - name: Install isolated browser test dependency
        run: npm --prefix qa ci --ignore-scripts --no-audit --no-fund
      - name: Chrome presence
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Native dashboard synthetic browser acceptance
        env:
          SENTINEL_CHROME_PATH: /usr/bin/google-chrome
          SENTINEL_QA_SCREENSHOTS_DIR: ${{ runner.temp }}/sentinel-g218-screenshots
          PYTHONDONTWRITEBYTECODE: '1'
        run: node noc/tests/test_enterprise_browser.cjs
      - name: Preserve synthetic visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-g218-synthetic-command-center-screens
          path: ${{ runner.temp }}/sentinel-g218-screenshots/*.png
          retention-days: 3
          if-no-files-found: ignore
