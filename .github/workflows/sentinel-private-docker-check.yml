name: Sentinel private Docker staging checks

on:
  pull_request:
    branches: [main]
    paths:
      - "noc/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/sentinel-private-docker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-docker-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python safety tests and syntax
        run: |
          python3 -B -m unittest noc.tests.test_docker_staging_contract -v
          python3 -B -m unittest noc.tests.test_noc -v
          python3 -B -m py_compile noc/server.py noc/store.py noc/sentinel_mission_full.py noc/sentinel_netpulse_interfaces.py noc/sentinel_network_lab.py
      - name: Frontend syntax
        run: |
          node --check noc/web/app.js
          node --check noc/web/enterprise-center.js
          node --check noc/web/mission-native.js
          node --check noc/web/netpulse-model.js
      - name: Validate isolated Compose topology (no deployment)
        env:
          SENTINEL_HOST_PORT: "13078"
          SENTINEL_BROWSER_ORIGIN: "http://127.0.0.1:13078"
        run: docker compose -f deploy/docker/compose.yaml config --quiet
      - name: Build both isolated Python images (no deployment)
        run: |
          docker build -f deploy/docker/Dockerfile.noc -t sentinel-noc-ci:local .
          docker build -f deploy/Dockerfile -t sentinel-monitor-ci:local .
      - name: Validate rootless Nginx ingress syntax (no deployment)
        run: |
          docker run --rm --user 101:101 --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /var/run:rw,mode=1777 \
            --tmpfs /var/cache/nginx:rw,mode=1777 \
            -v "$PWD/deploy/docker/nginx-private.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Run synthetic authenticated private stack (no public probes)
        run: |
          set -euo pipefail
          docker network create proxy_network
          python3 -B deploy/docker/select-private-port.py
          files="-f deploy/docker/compose.yaml -f deploy/docker/compose.ci.yaml"
          cleanup() {
            docker compose --env-file deploy/docker/.env $files down || true
            docker network rm proxy_network || true
          }
          trap cleanup EXIT
          docker compose --env-file deploy/docker/.env $files run --rm --no-deps --entrypoint python noc /app/bootstrap-private-pilot.py
          docker compose --env-file deploy/docker/.env $files up -d --wait
          docker compose --env-file deploy/docker/.env $files exec -T noc python /app/smoke-private-pilot.py
