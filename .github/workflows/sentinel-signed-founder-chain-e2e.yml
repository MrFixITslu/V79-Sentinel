name: Sentinel complete synthetic signed founder chain (NO LIVE SEND)

on:
  pull_request:
    branches: [fix/p1-mission-bridge-freshness-20261028]
    paths:
      - "noc/tests/test_isolated_signed_founder_chain_e2e.py"
      - ".github/workflows/sentinel-signed-founder-chain-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-full-chain-custody-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing test-only pinned Ed25519 dependency
        run: python3 -m pip install 'cryptography==45.0.7'
      - name: Run complete offline signed receiver/outbox/founder request chain
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m unittest -v \
            noc.tests.test_isolated_signed_founder_chain_e2e \
            noc.tests.test_sentinel_mission_bridge_freshness \
            noc.tests.test_owner_private_candidate \
            noc.tests.test_isolated_sqlite_durability \
            noc.tests.test_isolated_external_observer_gate \
            noc.tests.test_isolated_resend_founder_adapter \
            noc.tests.test_isolated_founder_delivery_protocol \
            noc.tests.test_isolated_atomic_advisory_outbox \
            noc.tests.test_isolated_sender_custody \
            noc.tests.test_isolated_signed_probe_pilot \
            noc.tests.test_inprocess_probe_receipt \
            noc.tests.test_legacy_monitor_proof \
            noc.tests.test_signed_owned_evidence \
            noc.tests.test_owned_replay_checkpoint \
            noc.tests.test_owned_https_evidence_gate
      - name: Rehearsal cannot send notifications, deploy, or import real secrets
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import ast
          source=Path('noc/tests/test_isolated_signed_founder_chain_e2e.py').read_text()
          ast.parse(source)
          for forbidden in ('requests.post(', 'urllib.request', 'send_email(',
                            'SMTP(', 'os.environ', 'subprocess.', 'docker ',
                            'socket.create_connection(', 'Resend(', 'GH_TOKEN'):
              assert forbidden not in source, forbidden
          for evidence in ('Ed25519PrivateKey.generate()', 'TemporaryDirectory(',
                           'reserve_isolated_resend_request',
                           'accept_signed_founder_ack',
                           'sourceProvenanceVerified'):
              assert evidence in source, evidence
          print('SIGNED_FOUNDER_REHEARSAL_OFFLINE_NO_DISPATCH=PASS')
          PY
