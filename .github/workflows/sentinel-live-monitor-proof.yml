name: Sentinel legacy monitor proof bridge (isolated no deploy)

on:
  pull_request:
    paths:
      - 'noc/legacy_monitor_proof.py'
      - 'noc/tests/test_legacy_monitor_proof.py'
      - 'noc/owned_alert_state.py'
      - 'noc/tests/test_owned_alert_state.py'
      - 'noc/owner_alert_preview.py'
      - 'noc/tests/test_owner_alert_preview.py'
      - 'noc/owner_shadow_rehearsal.py'
      - 'noc/owner_private_candidate.py'
      - 'noc/offhost_watchdog_policy.py'
      - 'noc/tests/test_offhost_watchdog_policy.py'
      - 'noc/tests/test_owner_shadow_rehearsal.py'
      - 'scripts/sentinel_owner_shadow.py'
      - 'noc/tests/test_sentinel_owner_shadow_cli.py'
      - 'noc/signed_owned_evidence.py'
      - 'noc/owned_https_evidence_gate.py'
      - 'noc/inprocess_probe_receipt.py'
      - 'noc/tests/test_inprocess_probe_receipt.py'
      - 'noc/tests/test_dns_pinned_https_probe.py'
      - 'noc/runtime_source_parity_gate.py'
      - 'noc/tests/test_runtime_source_parity_gate.py'
      - 'scripts/check_sentinel_candidate_lock.py'
      - 'noc/tests/test_candidate_dependency_policy.py'
      - 'monitor_core.py'
      - 'sentinel.py'
      - '.github/workflows/sentinel-live-monitor-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-signed-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin synthetic-signature verification dependency
        run: python -m pip install 'cryptography==45.0.7'
      - name: Compile bridge and isolated adversarial cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import ast
          for name in (
            'noc/legacy_monitor_proof.py',
            'noc/tests/test_legacy_monitor_proof.py',
            'noc/owned_alert_state.py',
            'noc/tests/test_owned_alert_state.py',
            'noc/owner_alert_preview.py',
            'noc/tests/test_owner_alert_preview.py',
            'noc/owner_shadow_rehearsal.py',
            'noc/owner_private_candidate.py',
            'noc/offhost_watchdog_policy.py',
            'noc/tests/test_offhost_watchdog_policy.py',
            'noc/tests/test_owner_shadow_rehearsal.py',
            'scripts/sentinel_owner_shadow.py',
            'noc/tests/test_sentinel_owner_shadow_cli.py',
            'noc/inprocess_probe_receipt.py',
            'noc/tests/test_inprocess_probe_receipt.py',
            'noc/tests/test_dns_pinned_https_probe.py',
            'noc/runtime_source_parity_gate.py',
            'noc/tests/test_runtime_source_parity_gate.py',
            'scripts/check_sentinel_candidate_lock.py',
            'noc/tests/test_candidate_dependency_policy.py',
            'monitor_core.py',
            'sentinel.py'
          ):
            ast.parse(open(name,encoding='utf-8').read(),filename=name)
          print('SYNTAX_PASS')
          PY
          python -B -m unittest noc.tests.test_legacy_monitor_proof -v
          python -B -m unittest noc.tests.test_owned_alert_state -v
          python -B -m unittest noc.tests.test_owner_alert_preview -v
          python -B -m unittest noc.tests.test_owner_shadow_rehearsal -v
          python -B -m unittest noc.tests.test_offhost_watchdog_policy -v
          python -B -m unittest noc.tests.test_sentinel_owner_shadow_cli -v
          python -B -m unittest noc.tests.test_signed_owned_evidence -v
          python -B -m unittest noc.tests.test_owned_https_evidence_gate -v
          python -B -m unittest noc.tests.test_inprocess_probe_receipt -v
          python -B -m unittest noc.tests.test_dns_pinned_https_probe -v
          python -B -m unittest noc.tests.test_runtime_source_parity_gate -v
          python -B -m unittest noc.tests.test_candidate_dependency_policy -v
