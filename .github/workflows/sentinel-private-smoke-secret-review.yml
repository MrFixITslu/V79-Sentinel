name: Sentinel isolated staging secret-file security review

on:
  pull_request:
    branches: [fix/p1-isolated-journal-durability-gate-20261028]
    paths:
      - "deploy/docker/smoke-private-pilot.py"
      - "noc/tests/test_private_smoke_secret_file.py"
      - ".github/workflows/sentinel-private-smoke-secret-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-secret-file-and-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing pinned Ed25519 test dependency
        run: python3 -m pip install 'cryptography==45.0.7'
      - name: Secret metadata, ancestry, no-leak and full isolated regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m unittest -v \
            noc.tests.test_private_smoke_secret_file \
            noc.tests.test_isolated_sqlite_durability \
            noc.tests.test_isolated_external_observer_gate \
            noc.tests.test_isolated_resend_founder_adapter \
            noc.tests.test_isolated_founder_delivery_protocol \
            noc.tests.test_isolated_atomic_advisory_outbox \
            noc.tests.test_isolated_sender_custody \
            noc.tests.test_isolated_signed_probe_pilot \
            noc.tests.test_inprocess_probe_receipt \
            noc.tests.test_legacy_monitor_proof \
            noc.tests.test_signed_owned_evidence \
            noc.tests.test_owned_replay_checkpoint \
            noc.tests.test_owned_https_evidence_gate
      - name: No new secret, exception spill, scanner bypass or deployment
        run: |
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          file=Path("deploy/docker/smoke-private-pilot.py")
          source=file.read_text()
          ast.parse(source)
          assert "os.O_NOFOLLOW" in source
          assert "os.fstat" in source
          assert "_read_private_pilot_password(PASSWORD)" in source
          for forbidden in ("PASSWORD.read_text()", "print(password)", "print(PASSWORD)",
                            "gitguardian:ignore", "ggignore", "send_email("):
              assert forbidden not in source, forbidden
          print("SECRET_FILE_NO_BYPASS_NO_DEPLOY=PASS")
          PY
